[phases.setup]
nixPkgs = ['nodejs_20', 'pnpm-9_x', 'openssl', 'curl', 'ffmpeg', 'python3']
aptPkgs = []

[phases.install]
cmds = [
  'pnpm install',
  'pip3 install --break-system-packages yt-dlp || python3 -m pip install --break-system-packages yt-dlp || true'
]

[phases.build]
cmds = [
  'pnpm run build',
  'mkdir -p .next/standalone/public',
  'cp -r public/* .next/standalone/public/ || true',
  'mkdir -p .next/standalone/.next/static',
  'cp -r .next/static/* .next/standalone/.next/static/ || true'
]

[start]
cmd = "node .next/standalone/server.js"
