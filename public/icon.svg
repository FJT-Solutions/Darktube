<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dt_bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="dt_play" x1="180" y1="140" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
    <filter id="dt_shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="#09090B"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#dt_bg)"/>
  
  <!-- Dark Screen Display Frame -->
  <rect x="76" y="116" width="360" height="280" rx="64" fill="#09090B" opacity="0.92" filter="url(#dt_shadow)"/>
  <rect x="76" y="116" width="360" height="280" rx="64" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Play Symbol / Viral Center -->
  <path d="M220 196L332 256L220 316V196Z" fill="url(#dt_play)"/>
  
  <!-- Golden Sparkle Accent -->
